name: Publish app image

# Builds the Cloudron image, pushes it to this repository's GHCR package and
# points CloudronVersions.json at the image that was just pushed, so a Cloudron
# server can install the app straight from the raw URL of that file.
#
# Bump "version" in CloudronManifest.json (and add a CHANGELOG entry) first,
# then run this workflow from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      publish_state:
        description: "publishState recorded for this version"
        type: choice
        options: [published, testing]
        default: published

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image is ~3.5GB and the upstream image it is built from is another
      # 3GB, which does not fit next to the runner's preinstalled toolchains.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Read package version
        id: meta
        run: |
          version=$(python3 -c "import json; print(json.load(open('CloudronManifest.json'))['version'])")
          image=ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "Building ${image}:${version}"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}" \
            -t "${{ steps.meta.outputs.image }}:latest" .

      - name: Push image
        id: push
        run: |
          docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
          docker push "${{ steps.meta.outputs.image }}:latest"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' \
              "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}" | cut -d@ -f2)
          echo "ref=${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Update CloudronVersions.json
        run: |
          scripts/build-versions.py \
            --docker-image "${{ steps.push.outputs.ref }}" \
            --publish-state "${{ inputs.publish_state }}"

      - name: Commit CloudronVersions.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CloudronVersions.json
          if git diff --quiet --cached; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Publish ${{ steps.meta.outputs.version }} (${{ steps.push.outputs.ref }})"
          git push origin HEAD:${{ github.ref_name }}
